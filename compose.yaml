services:
  observable:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18085:8080"
    volumes:
      - reports:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  reports:
