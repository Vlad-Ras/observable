# Include this file at http level, as Ubuntu sites-enabled normally does.
limit_req_zone $binary_remote_addr zone=observable_upload:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=observable_connections:1m;

server {
    listen 80;
    server_name observable.roften.ru;
    client_max_body_size 8m;
    client_body_timeout 30s;
    limit_conn observable_connections 8;

    location /v1/add/ {
        # The URL contains a private upload token; never write it to access logs.
        access_log off;
        limit_req zone=observable_upload burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    location / {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 45s;
    }
}
